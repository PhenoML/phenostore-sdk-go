name: Regenerate SDK

on:
  repository_dispatch:
    types: [spec-updated]
  workflow_dispatch: # manual trigger (uses committed api/openapi.yaml)

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for Anthropic workload identity federation.

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Prepare workspace from dispatch payload
        if: github.event_name == 'repository_dispatch'
        env:
          SPEC_B64: ${{ github.event.client_payload.spec_b64 }}
          SPEC_SHA: ${{ github.event.client_payload.spec_sha }}
        run: |
          echo "$SPEC_B64" | base64 -d > api/openapi.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "sdk-regen/${SPEC_SHA}"

      - name: Regenerate client
        run: go generate ./phenostore/

      - name: Check if build passes after regeneration
        id: try-build
        continue-on-error: true
        run: go build ./...

      # If the spec introduced breaking type changes, use Claude Code to
      # adapt the hand-written wrapper (client.go, errors.go, examples/).
      - name: Adapt wrapper to generated changes
        if: steps.try-build.outcome == 'failure'
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        with:
          show_full_output: ${{ runner.debug == '1' }}
          prompt: "Read and follow the instructions in .github/prompts/adapt-to-generated-changes.md"
          claude_args: "--model opus --allowedTools View,Edit,Write,GlobTool,GrepTool,Bash(go:*)"
          anthropic_federation_rule_id: fdrl_011V1ada7WqjYRpXsNLW6wE9
          anthropic_organization_id: 3d765a0f-2011-4f41-ae8b-2c149547f81c
          anthropic_service_account_id: svac_013MTiyRpDp6bsxf1589G3As
          anthropic_workspace_id: wrkspc_016wWcB4rGaSpRjCjwwQhcD4
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify compilation
        run: go build ./...

      - name: Run tests
        run: go test -race -count=1 -timeout 5m ./...

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SDK regeneration produced no changes."
          fi

      - name: Generate commit message
        if: github.event_name == 'repository_dispatch' && steps.changes.outputs.changed == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        with:
          show_full_output: ${{ runner.debug == '1' }}
          prompt: |
            The upstream PR title is: ${{ github.event.client_payload.pr_title }}

            Read and follow the instructions in .github/prompts/generate-commit-message.md
          claude_args: '--model sonnet --allowedTools "View,GlobTool,GrepTool,Bash(git diff:*),Write"'
          anthropic_federation_rule_id: fdrl_011V1ada7WqjYRpXsNLW6wE9
          anthropic_organization_id: 3d765a0f-2011-4f41-ae8b-2c149547f81c
          anthropic_service_account_id: svac_013MTiyRpDp6bsxf1589G3As
          anthropic_workspace_id: wrkspc_016wWcB4rGaSpRjCjwwQhcD4
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pull request
        if: github.event_name == 'repository_dispatch' && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC_SHA: ${{ github.event.client_payload.spec_sha }}
          PHENOSTORE_SHA: ${{ github.event.client_payload.phenostore_sha }}
          PR_TITLE: ${{ github.event.client_payload.pr_title }}
        run: |
          BRANCH="sdk-regen/${SPEC_SHA}"

          if [[ -f .commit-message ]] && [[ -s .commit-message ]]; then
            COMMIT_TITLE=$(head -1 .commit-message)
          fi
          rm -f .commit-message
          if [[ -z "${COMMIT_TITLE}" ]]; then
            if [[ -n "${PR_TITLE}" ]]; then
              COMMIT_TITLE="feat: regenerate SDK — ${PR_TITLE}"
            else
              COMMIT_TITLE="feat: regenerate SDK from spec ${SPEC_SHA}"
            fi
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "::notice::SDK regeneration produced no changes to commit."
            exit 0
          fi
          git commit -m "${COMMIT_TITLE}"
          git push -u --force origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "${COMMIT_TITLE}" \
            --body "Automated SDK regeneration.

          **Spec version:** \`${SPEC_SHA}\`
          **Phenostore commit:** \`${PHENOSTORE_SHA}\`

          > Adjust the PR title prefix before merging to control the version bump:
          > \`feat:\` → minor, \`fix:\` → patch, \`feat!:\` → major, \`chore:\` → no release."
