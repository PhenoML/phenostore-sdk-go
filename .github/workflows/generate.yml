name: Regenerate SDK

on:
  repository_dispatch:
    types: [spec-updated]
  workflow_dispatch: # manual trigger (uses committed api/openapi.yaml)

permissions:
  contents: read

concurrency:
  group: regenerate-sdk
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Import upstream spec
        if: github.event_name == 'repository_dispatch'
        env:
          SPEC_B64: ${{ github.event.client_payload.spec_b64 }}
          SPEC_SHA: ${{ github.event.client_payload.spec_sha }}
        run: bash .github/scripts/import-spec.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Generate client
        env:
          GOTOOLCHAIN: auto
        run: make generate

      - name: Check SDK compatibility
        id: compatibility
        continue-on-error: true
        env:
          GOTOOLCHAIN: local
        run: make check

      - name: Adapt wrapper to generated changes
        id: adapt
        if: steps.compatibility.outcome == 'failure'
        uses: anthropics/claude-code-action@aa8a7738e48bf30a40ee499ce818bef081c5ab5e # v1.0.257
        with:
          show_full_output: ${{ runner.debug == '1' }}
          prompt: Read and follow the instructions in .github/prompts/adapt-to-generated-changes.md
          claude_args: >-
            --model opus --max-turns 40
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(go:*),Bash(make:*),Bash(git diff:*),Bash(git status:*)"
          anthropic_federation_rule_id: fdrl_011V1ada7WqjYRpXsNLW6wE9
          anthropic_organization_id: 3d765a0f-2011-4f41-ae8b-2c149547f81c
          anthropic_service_account_id: svac_013MTiyRpDp6bsxf1589G3As
          anthropic_workspace_id: wrkspc_016wWcB4rGaSpRjCjwwQhcD4
          anthropic_oidc_audience: https://api.anthropic.com
          github_token: ${{ github.token }}

      - name: Verify adapted SDK
        if: steps.compatibility.outcome == 'failure'
        env:
          GOTOOLCHAIN: local
        run: make check

      - name: Check for changes
        id: changes
        env:
          INCLUDE_WRAPPER_CHANGES: ${{ steps.adapt.outcome == 'success' }}
        run: bash .github/scripts/open-regeneration-pr.sh --check

      - name: Classify SDK release
        id: classify
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@aa8a7738e48bf30a40ee499ce818bef081c5ab5e # v1.0.257
        env:
          UPSTREAM_PR_TITLE: ${{ github.event.client_payload.pr_title }}
        with:
          show_full_output: ${{ runner.debug == '1' }}
          prompt: Read and follow the instructions in .github/prompts/generate-commit-message.md
          claude_args: >-
            --model sonnet --max-turns 10
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(printenv UPSTREAM_PR_TITLE),Write"
          anthropic_federation_rule_id: fdrl_011V1ada7WqjYRpXsNLW6wE9
          anthropic_organization_id: 3d765a0f-2011-4f41-ae8b-2c149547f81c
          anthropic_service_account_id: svac_013MTiyRpDp6bsxf1589G3As
          anthropic_workspace_id: wrkspc_016wWcB4rGaSpRjCjwwQhcD4
          anthropic_oidc_audience: https://api.anthropic.com
          github_token: ${{ github.token }}

      - name: Open or update regeneration PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SPEC_SHA: ${{ github.event.client_payload.spec_sha }}
          PHENOSTORE_SHA: ${{ github.event.client_payload.phenostore_sha }}
          INCLUDE_WRAPPER_CHANGES: ${{ steps.adapt.outcome == 'success' }}
          VALIDATED_TREE: ${{ steps.changes.outputs.tree }}
          CLASSIFICATION_SUCCEEDED: ${{ steps.classify.outcome == 'success' }}
        run: bash .github/scripts/open-regeneration-pr.sh
