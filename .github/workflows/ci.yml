name: CI

on:
  pull_request:
    branches: [main]
  # Generator maintenance uses this because GITHUB_TOKEN-created PRs do not
  # trigger pull_request workflows automatically.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Change this explicitly when intentionally raising SDK requirements.
      SDK_GO_VERSION: "1.24.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.SDK_GO_VERSION }}

      - name: Build
        env:
          GOTOOLCHAIN: local
        run: go build ./...

      - name: Test
        env:
          GOTOOLCHAIN: local
        run: go test -race -count=1 -timeout 5m ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      - name: Check generated files are current
        run: make check-generated
